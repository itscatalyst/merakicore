version: 2
goal_id: meraki-core-studio-foundation
source_of_truth: true
unlock_rule: dependent work starts only after every required gate has reviewer verdict ACCEPT
defaults:
  review_required: true
  packet_stop_conditions: [contract_conflict, allowlist_violation, scope_expansion, security_invariant_failure]
gates:
  - id: G0
    name: Control plane and security foundation
    requires_accepted_gates: []
    packets:
      - { id: G0-C0, title: Plan and contract reconciliation, role: principal_architect, depends_on: [] }
      - { id: G0-C1, title: Repository scaffold, role: repo_worker, depends_on: [G0-C0] }
      - { id: G0-C2, title: Canonical schemas and OpenAPI, role: principal_architect, depends_on: [G0-C0] }
      - { id: G0-C3, title: Generated contract types, role: contract_worker, depends_on: [G0-C2] }
      - { id: G0-C4, title: Database tenancy RLS audit and idempotency foundation, role: infra_worker, depends_on: [G0-C2] }
      - { id: G0-C5, title: Provider artifact and identity ports, role: architect_worker, depends_on: [G0-C2] }
      - { id: G0-C6, title: Orchestration state and gate runner, role: ops_worker, depends_on: [G0-C0, G0-C1] }
      - { id: G0-C7, title: CI drift migration and isolation tests, role: test_worker, depends_on: [G0-C3, G0-C4, G0-C6] }
    commands: [pnpm typecheck, pnpm lint, pnpm test, pnpm contracts:check, pnpm db:test-migrations, pnpm security:test-isolation]
    proof: [contracts_validate, generated_types_match, migration_up_down_up, concurrent_idempotency, cross_tenant_denied, dag_loads]
  - id: G1
    name: Explicit correction vertical slice
    requires_accepted_gates: [G0]
    packets:
      - { id: G1-E1, title: Correction ingest fixture, role: evidence_worker, depends_on: [] }
      - { id: G1-L1, title: Deterministic correction extractor, role: extractor_worker, depends_on: [G1-E1] }
      - { id: G1-P1, title: Task-local atom lifecycle, role: profile_worker, depends_on: [G1-L1] }
      - { id: G1-R1, title: Deterministic guide and pack, role: guidance_worker, depends_on: [G1-P1] }
      - { id: G1-V1, title: Adapter-backed correction loop proof, role: evaluation_worker, depends_on: [G1-R1] }
    proof: [immutable_evidence, complete_lineage, related_pack_changes, unrelated_pack_byte_invariant, real_adapter_behavior_change]
  - id: G2
    name: Evidence extraction privacy and deletion
    requires_accepted_gates: [G1]
    packets:
      - { id: G2-E1, title: Source registry artifacts consent and trust, role: evidence_worker, depends_on: [] }
      - { id: G2-E2, title: Canonical events deduplication and deletion lineage, role: evidence_worker, depends_on: [G2-E1] }
      - { id: G2-X1, title: Deterministic edit extraction, role: extractor_worker, depends_on: [G2-E2] }
      - { id: G2-X2, title: Choice rejection approval extraction, role: extractor_worker, depends_on: [G2-E2] }
      - { id: G2-X3, title: Workflow and outcome extraction, role: extractor_worker, depends_on: [G2-E2] }
      - { id: G2-X4, title: Schema-bound model extraction and injection defense, role: extractor_worker, depends_on: [G2-E2] }
      - { id: G2-T1, title: Golden failure-atomic privacy fixtures, role: test_worker, depends_on: [G2-X1, G2-X2, G2-X3, G2-X4] }
    proof: [golden_precision, failure_atomicity, deduplication, injection_safe, consent_enforced, deletion_propagates]
  - id: G3
    name: Profile modes lifecycle and rollback
    requires_accepted_gates: [G2]
    packets:
      - { id: G3-P1, title: Versioned atom edge snapshot store, role: profile_worker, depends_on: [] }
      - { id: G3-P2, title: Facet ontology registry, role: principal_architect, depends_on: [G3-P1] }
      - { id: G3-P3, title: Lifecycle contradiction and rollback policy, role: profile_worker, depends_on: [G3-P2] }
      - { id: G3-M1, title: Explicit and rule-based mode resolver, role: profile_worker, depends_on: [G3-P2] }
      - { id: G3-T1, title: Pairwise preference model with uncertainty, role: learning_worker, depends_on: [G3-P1] }
      - { id: G3-Q1, title: Active question selector, role: learning_worker, depends_on: [G3-P3, G3-M1] }
    proof: [mode_coexistence, scope_safety, optimistic_concurrency, rollback, preference_uncertainty]
  - id: G4
    name: Retrieval and deterministic guidance
    requires_accepted_gates: [G3]
    packets:
      - { id: G4-R1, title: Task and mode analysis, role: guidance_worker, depends_on: [] }
      - { id: G4-R2, title: Permission scope lifecycle and sensitivity filters, role: guidance_worker, depends_on: [G4-R1] }
      - { id: G4-R3, title: Full-text retrieval, role: retrieval_worker, depends_on: [G4-R2] }
      - { id: G4-R4, title: Vector retrieval adapter, role: retrieval_worker, depends_on: [G4-R2] }
      - { id: G4-R5, title: Candidate fusion conflict and utility reranking, role: retrieval_worker, depends_on: [G4-R3, G4-R4] }
      - { id: G4-R6, title: Pack compiler provenance and debug explanation, role: guidance_worker, depends_on: [G4-R5] }
      - { id: G4-T1, title: Retrieval regression determinism and negative controls, role: evaluation_worker, depends_on: [G4-R6] }
    thresholds: { mandatory_recall: 1.0, pack_precision: 0.8, determinism: 1.0, negative_abstention: 0.9 }
  - id: G5
    name: Runtime agents and run ledger
    requires_accepted_gates: [G4]
    packets:
      - { id: G5-A1, title: REST API authenticated sessions and commands, role: api_worker, depends_on: [] }
      - { id: G5-A2, title: Generated TypeScript SDK, role: api_worker, depends_on: [G5-A1] }
      - { id: G5-A3, title: Bounded MCP adapter and agent registry, role: runtime_worker, depends_on: [G5-A2] }
      - { id: G5-L1, title: Immutable run and pack ledger, role: runtime_worker, depends_on: [] }
      - { id: G5-F1, title: Feedback outcomes and versioned commands, role: runtime_worker, depends_on: [G5-L1] }
      - { id: G5-O1, title: Bootstrap restart and clean install, role: ops_worker, depends_on: [G5-A1, G5-A3, G5-F1] }
    proof: [restart_persistence, two_session_isolation, immutable_pack_manifest, authenticated_commands]
  - id: G6
    name: Evaluation attribution and governed learning
    requires_accepted_gates: [G5]
    packets:
      - { id: G6-E1, title: Frozen blind experiment harness, role: evaluation_worker, depends_on: [] }
      - { id: G6-E2, title: Layered objective and human evaluators, role: evaluation_worker, depends_on: [G6-E1] }
      - { id: G6-E3, title: Attribution targeted ablation and raw-memory control, role: evaluation_worker, depends_on: [G6-E2] }
      - { id: G6-L1, title: Evidence-backed update proposals, role: learning_worker, depends_on: [G6-E3] }
      - { id: G6-L2, title: Policy application rejection and rollback, role: learning_worker, depends_on: [G6-L1] }
    proof: [blind_ab, equal_token_raw_memory, targeted_ablation, governed_update, rejected_update_invariant]
  - id: DS
    name: Dogfood security checkpoint
    requires_accepted_gates: [G6]
    packets:
      - { id: DS-S1, title: Independent pre-dogfood security privacy and deletion audit, role: independent_security_reviewer, depends_on: [] }
    proof: [auth_review, rls_review, consent_review, redaction_review, deletion_preview_review, export_review]
  - id: G7
    name: Permissioned longitudinal dogfood proof
    requires_accepted_gates: [DS]
    packets:
      - { id: G7-D1, title: Permissioned dogfood importer, role: evidence_worker, depends_on: [] }
      - { id: G7-D2, title: Human-reviewed labels, role: review_worker, depends_on: [G7-D1] }
      - { id: G7-D3, title: Frozen held-out and negative-control suites, role: evaluation_worker, depends_on: [G7-D2] }
      - { id: G7-D4, title: Reproducible proof bundle runner, role: evaluation_worker, depends_on: [G7-D3] }
      - { id: G7-D5, title: Error analysis and regression generation, role: error_analysis_worker, depends_on: [G7-D4] }
    proof: [full_bundle, heldout_tasks, failures_ties_abstentions_included, longitudinal_correction_burden]
  - id: G8
    name: Adversarial release hardening
    requires_accepted_gates: [G7]
    packets:
      - { id: G8-S1, title: Poisoning concurrency deletion backup and recovery hardening, role: security_worker, depends_on: [] }
      - { id: G8-R1, title: Clean-host release verification, role: independent_reviewer, depends_on: [G8-S1] }
    proof: [clean_install, tenant_isolation, deletion, export, backup_restore, corrupted_state_recovery, known_limitations]
  - id: S0
    name: Studio shell goal health and contracts
    requires_accepted_gates: [G0]
    packets:
      - { id: S0-U1, title: Studio scaffold and generated client, role: ui_systems_worker, depends_on: [] }
      - { id: S0-U2, title: IDE shell command bar and states, role: studio_architect, depends_on: [S0-U1] }
      - { id: S0-U3, title: Goal health and contract surfaces, role: profile_ux_worker, depends_on: [S0-U2] }
      - { id: S0-T1, title: Shell accessibility performance and contract tests, role: studio_reviewer, depends_on: [S0-U3] }
  - id: S1
    name: Visible correction loop
    requires_accepted_gates: [G1, S0]
    packets:
      - { id: S1-U1, title: Correction lineage and evidence inspector, role: observability_worker, depends_on: [] }
      - { id: S1-U2, title: Pack run evaluation inspector, role: observability_worker, depends_on: [S1-U1] }
      - { id: S1-U3, title: Versioned confirm edit limit revoke commands, role: profile_ux_worker, depends_on: [S1-U1] }
      - { id: S1-T1, title: Visible correction-loop E2E, role: studio_reviewer, depends_on: [S1-U2, S1-U3] }
  - id: S2
    name: Profile IDE and focused brain graph
    requires_accepted_gates: [G3, S1]
    packets:
      - { id: S2-U1, title: Paginated graph projection and read models, role: graph_worker, depends_on: [] }
      - { id: S2-U2, title: Focused accessible worker-laid-out graph, role: graph_worker, depends_on: [S2-U1] }
      - { id: S2-U3, title: Profile modes contradictions versions and learning queue, role: profile_ux_worker, depends_on: [S2-U1] }
      - { id: S2-T1, title: Graph truth accessibility and performance, role: studio_reviewer, depends_on: [S2-U2, S2-U3] }
  - id: S3
    name: Agents and live traces
    requires_accepted_gates: [G5, S2]
    packets:
      - { id: S3-U1, title: Agent registry heartbeat and controls, role: observability_worker, depends_on: [] }
      - { id: S3-U2, title: Authenticated replayable SSE console, role: observability_worker, depends_on: [S3-U1] }
      - { id: S3-U3, title: Paginated run and trace viewer, role: observability_worker, depends_on: [S3-U2] }
      - { id: S3-T1, title: Multi-agent restart permission E2E, role: studio_reviewer, depends_on: [S3-U3] }
  - id: S4
    name: Evaluation and governed learning control
    requires_accepted_gates: [G6, S3]
    packets:
      - { id: S4-U1, title: Frozen experiment builder and blind review, role: evaluation_ux_worker, depends_on: [] }
      - { id: S4-U2, title: Metrics uncertainty ablation and attribution, role: evaluation_ux_worker, depends_on: [S4-U1] }
      - { id: S4-U3, title: Update proposal approval rejection and rollback, role: profile_ux_worker, depends_on: [S4-U2] }
      - { id: S4-T1, title: Reproducible evaluation E2E, role: studio_reviewer, depends_on: [S4-U3] }
  - id: S5
    name: Goals sources proof and release
    requires_accepted_gates: [G8, S4]
    packets:
      - { id: S5-U1, title: User goals and objective progress, role: profile_ux_worker, depends_on: [] }
      - { id: S5-U2, title: Sources deletion impact and export, role: security_ui_worker, depends_on: [] }
      - { id: S5-U3, title: Policies debug proof bundles and limitations, role: studio_architect, depends_on: [S5-U1, S5-U2] }
      - { id: S5-T1, title: Clean-install accessibility and product proof, role: independent_studio_reviewer, depends_on: [S5-U3] }
completion_requires_accepted_gates: [G8, S5]
