version: 1
gates:
- id: G0
  name: Control plane
  required_packets:
  - G0-C1
  - G0-C2
  - G0-C3
  - G0-C4
  - G0-C5
  - G0-C6
  - G0-C7
  required_commands:
  - pnpm typecheck
  - pnpm lint
  - pnpm test
  - pnpm contracts:check
  - pnpm db:test-migrations
  review_required: true
- id: G1
  name: Explicit correction vertical slice
  required_packets:
  - G1-E1
  - G1-L1
  - G1-P1
  - G1-R1
  - G1-V1
  proof:
  - related_pack_changes
  - unrelated_pack_invariant
  - complete_lineage
  review_required: true
- id: G2
  name: Evidence and extraction
  required_packets:
  - G2-E1
  - G2-E2
  - G2-X1
  - G2-X2
  - G2-X3
  - G2-X4
  - G2-T1
  proof:
  - golden_precision
  - failure_atomicity
  - deduplication
  - injection_safe
  review_required: true
- id: G3
  name: Profile modes lifecycle
  required_packets:
  - G3-P1
  - G3-P2
  - G3-P3
  - G3-M1
  - G3-T1
  - G3-Q1
  proof:
  - mode_coexistence
  - scope_safety
  - rollback
  - preference_uncertainty
  review_required: true
- id: G4
  name: Guidance
