name: meraki-core

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: meraki
      POSTGRES_USER: meraki
      POSTGRES_PASSWORD: meraki_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meraki -d meraki"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - meraki-postgres:/var/lib/postgresql/data

volumes:
  meraki-postgres:
