name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0 PyYAML==6.0.2
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod
      - name: Secret scan
        run: pnpm security:secrets
      - name: Verify
        run: pnpm verify
